server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: स्थिर फ़ाइल न मिले तो index.html का उपयोग करें.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # backend पर रिवर्स प्रॉक्सी
    # ब्राउज़र को हमेशा उसी ओरिजिन पर अनुरोध भेजना होता है जहाँ से पेज खोला गया है,
    # इसलिए frontend में backend के होस्ट नाम/पोर्ट को हार्डकोड नहीं करना पड़ता.
    location /app/api {
        proxy_pass http://backend:8000/app/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
