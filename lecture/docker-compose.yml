services:
  backend:
    build: ./backend
    # होस्ट पर पोर्ट प्रकाशित नहीं करते हैं.
    # frontend का nginx उसी Docker नेटवर्क में backend:8000 पर
    # रिवर्स प्रॉक्सी करता है, इसलिए बाहर से सीधे पहुँच की ज़रूरत नहीं है.
    # (प्रकाशित रहने पर Codespace की पोर्ट सूची में 8000 भी दिखता है, जिससे भ्रम होता है.)
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
